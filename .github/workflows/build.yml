name: build

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test and package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Verify tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "v$(tr -d '[:space:]' < VERSION)" = "${GITHUB_REF_NAME}"

      - name: Compile backend
        run: python -m compileall -q backend

      - name: Backend tests
        run: python -m unittest discover -s backend/tests -v

      - name: Frontend syntax checks
        run: |
          node --check frontend/theme.js
          node --check frontend/tools.js
          node --check frontend/app.js

      - name: Frontend tests
        run: node --test tests/frontend_tools.test.js

      - name: Build x86_64
        run: python build.py --platform x86_64

      - name: Build aarch64
        run: python build.py --platform aarch64

      - name: Verify checksums
        working-directory: dist
        run: sha256sum -c ./*.sha256

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: yuii-reader-packages
          path: |
            dist/*.deb
            dist/*.sha256
          if-no-files-found: error

  release:
    name: Publish release assets
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          name: yuii-reader-packages
          path: dist

      - name: Verify checksums
        working-directory: dist
        run: sha256sum -c ./*.sha256

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" dist/*.deb dist/*.sha256 --clobber
          else
            gh release create "${GITHUB_REF_NAME}" dist/*.deb dist/*.sha256 \
              --title "Yuii Reader ${GITHUB_REF_NAME}" \
              --generate-notes
          fi
