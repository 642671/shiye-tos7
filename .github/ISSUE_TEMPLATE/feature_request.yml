name: Feature request
description: 提出功能或体验改进建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        请先描述使用场景和当前的不便，再给建议方案。
        路线图见 ROADMAP.md，重复需求会被合并。

  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
      description: 你在什么情况下遇到了什么问题？
      placeholder: 我订阅了 …，每天需要 …
    validations:
      required: true

  - type: textarea
    id: current
    attributes:
      label: 目前的替代做法
      description: 现在如何绕过这个问题，为什么不够好？
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 可以描述交互、设置项或 API；不必是最终实现
    validations:
      required: true

  - type: textarea
    id: tradeoffs
    attributes:
      label: 取舍
      description: 是否接受默认关闭、增加设置项、限制频率等取舍？
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: 确认
      options:
        - label: 我已搜索现有 issue 和 ROADMAP，未发现重复
          required: true
        - label: 这个需求不依赖新的第三方运行时或云服务
          required: false
