name: Bug report
description: 报告可复现的缺陷
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请先搜索已有 issue，并尽量提供最小复现步骤。
        安全问题不要在这里提交，请见 SECURITY.md。

  - type: input
    id: version
    attributes:
      label: Yuii Reader 版本
      description: 设置页或 DEBIAN/control 中的版本号
      placeholder: "0.1.0"
    validations:
      required: true

  - type: input
    id: tos
    attributes:
      label: TOS 版本与设备
      description: 例如 TOS 7.1.0 / F4-424 / x86_64；如果运行在源码环境请注明
      placeholder: "TOS 7.1.0, x86_64"
    validations:
      required: true

  - type: dropdown
    id: install
    attributes:
      label: 安装方式
      options:
        - .deb 安装包
        - 源码运行（python backend/yuii-reader-service）
        - 其他
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 从打开应用开始逐步描述
      placeholder: |
        1. 打开 …
        2. 点击 …
        3. 出现 …
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      description: 附截图、错误提示或控制台报错
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 日志
      description: |
        可附 journalctl -u yuiireader-system -n 100 的输出、
        /usr/local/yuii-reader/logs/postinst-diagnostic.txt，或浏览器控制台错误。
      render: shell
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: 确认
      options:
        - label: 我已搜索现有 issue，未发现重复
          required: true
        - label: 这不是安全问题（安全问题按 SECURITY.md 私下报告）
          required: true
